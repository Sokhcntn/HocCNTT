function nav(){let s='';for(let m=1;m<=12;m++){let ww=DB.weeks.map((w,i)=>({...w,n:i+1})).filter(w=>w.month===m);s+=`<details class="month" ${selectedWeek>=ww[0].n&&selectedWeek<=ww.at(-1).n?'open':''}><summary>Tháng ${m} · ${esc(ww[0].monthTitle)}</summary>`;for(const w of ww)s+=`<button class="navbtn weeknav" onclick="selectedWeek=${w.n};view='week';render()">Tuần ${w.n} · ${esc(w.title)} (${DB.lessons.filter(x=>x.week===w.n&&state.done[x.day]).length}/7)</button>`;s+='</details>'}document.getElementById('sidebar').innerHTML=s}

function viRelated(month){return VI_REFS.filter(r=>r.months.includes(month))}
function viCards(month){let arr=month?viRelated(month):VI_REFS;return arr.map(r=>`<div class="card"><h3>${esc(r.name)}</h3><span class="pill">${esc(r.topic)}</span><p class="muted tiny">${esc(r.note)}</p><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Mở học liệu tiếng Việt ↗</a></div>`).join('')}
function render(){nav();let e=document.getElementById('main');if(view==='home')e.innerHTML=home();if(view==='week')e.innerHTML=weekPage();if(view==='day')e.innerHTML=dayPage();if(view==='library')e.innerHTML=library();if(view==='ai')e.innerHTML=aiPage();if(view==='backup')e.innerHTML=backup();if(view==='exam')e.innerHTML=exam();}
function home(){let n=doneCount(),hours=DB.lessons.reduce((a,x)=>a+(state.done[x.day]?x.hours:0),0);let next=DB.lessons.find(x=>!state.done[x.day]);return `<h2>Tiến độ toàn khóa</h2><div class="grid"><div class="card"><div class="muted">Buổi hoàn thành</div><h2>${n}/364</h2></div><div class="card"><div class="muted">Giờ học theo kế hoạch</div><h2>${hours}/1040</h2></div><div class="card"><div class="muted">Tuần hoàn thành</div><h2>${DB.weeks.filter((w,i)=>DB.lessons.filter(x=>x.week===i+1).every(x=>state.done[x.day])).length}/52</h2></div><div class="card"><div class="muted">Tiến độ</div><h2>${(n/364*100).toFixed(1)}%</h2></div></div><div class="card"><h3>Toàn bộ chương trình</h3><div class="bar"><div class="fill" style="width:${n/364*100}%"></div></div><p>52 tuần × 20 giờ. Các buổi thứ Hai–Sáu: 2 giờ; thứ Bảy: 6 giờ; Chủ Nhật: 4 giờ.</p>${next?`<button class="primary" onclick="selectedDay=${next.day};selectedWeek=${next.week};view='day';render()">Học tiếp: Ngày ${next.day} — ${esc(next.title)}</button>`:'<strong>Đã hoàn thành toàn bộ!</strong>'}</div><div class="card"><h3>12 học phần</h3><div class="grid">${Array.from({length:12},(_,i)=>{let ls=DB.lessons.filter(x=>x.month===i+1);let n=ls.filter(x=>state.done[x.day]).length;return `<div><b>Tháng ${i+1}: ${esc(DB.weeks.find(x=>x.month===i+1).monthTitle)}</b><p class="tiny muted">${n}/${ls.length} buổi</p><div class="bar"><div class="fill" style="width:${n/ls.length*100}%"></div></div></div>`}).join('')}</div></div><div class="notice">Đây là chương trình tự học tăng tốc tham chiếu các lĩnh vực của ngành CNTT, không cấp bằng đại học. Bài giảng là đề cương học tập có hướng dẫn, cần học cùng tài liệu gốc và tự thực hành.</div>`}
function weekPage(){let w=DB.weeks[selectedWeek-1],ls=DB.lessons.filter(x=>x.week===selectedWeek);return `<h2>Tuần ${selectedWeek}: ${esc(w.title)}</h2><p class="muted">Tháng ${w.month} · 20 giờ · ${esc(w.concept)}</p><div class="card"><h3>Mục tiêu và sản phẩm</h3><p><b>Kiến thức:</b> ${esc(w.concept)}</p><p><b>Sản phẩm:</b> ${esc(w.product)}</p><p><b>Tiêu chí:</b> Hoàn thành bài tập, kiểm thử, tự giải thích nguyên lý và đạt ≥70/100 trong đánh giá tuần.</p><label>Điểm tuần (0–100)</label><input type="number" min="0" max="100" value="${state.scores[selectedWeek]??''}" onchange="state.scores[${selectedWeek}]=Math.max(0,Math.min(100,Number(this.value)));save()"></div><div class="card"><h3>Lộ trình 7 buổi</h3>${ls.map(x=>`<div class="day ${state.done[x.day]?'done':''}"><button onclick="selectedDay=${x.day};view='day';render()">${state.done[x.day]?'✓ ':''}Ngày ${x.day} · ${esc(x.title)}</button><span class="pill">${x.hours} giờ</span></div>`).join('')}</div><div class="flex"><button class="secondary" onclick="selectedWeek=Math.max(1,selectedWeek-1);render()">← Tuần trước</button><button class="primary" onclick="selectedWeek=Math.min(52,selectedWeek+1);render()">Tuần tiếp →</button></div>`}
function dayPage(){let x=DB.lessons[selectedDay-1],w=DB.weeks[x.week-1];return `<div class="flex"><button class="secondary" onclick="view='week';selectedWeek=${x.week};render()">← Tuần ${x.week}</button><span class="pill">Ngày ${x.day}/364 · ${x.hours} giờ</span></div><h2>${esc(x.title)}</h2><p class="muted">${esc(w.title)} · Trọng tâm: ${esc(x.focus)}</p><div class="card"><h3>1. Bài giảng và nguyên lý</h3><p>${esc(x.theory)}</p><p><b>Khái niệm tuần:</b> ${esc(w.concept)}</p><p>Phương pháp: đọc tài liệu chính thức, tự diễn giải bằng ví dụ, thực hành rồi đối chiếu kết quả. Ghi lại thuật ngữ tiếng Anh để sử dụng đúng chuyên môn.</p></div><div class="card"><h3>2. Bài tập thực hành</h3><p>${esc(x.exercise)}</p><h3>3. Sản phẩm phải nộp</h3><p>${esc(x.output)}</p><h3>4. Tiêu chí đánh giá</h3><p>${esc(x.criteria)}</p><p>Chỉ đánh dấu hoàn thành khi có bằng chứng học tập (mã nguồn, bài giải, sơ đồ, ảnh chụp kết quả hoặc tài liệu).</p></div><div class="card"><h3>5. Học liệu tiếng Việt theo tháng</h3><p class="muted">Ưu tiên đọc tài liệu tiếng Việt để nắm khái niệm; đối chiếu thuật ngữ với tài liệu gốc tiếng Anh.</p><div class="grid">${viCards(x.month)}</div></div><div class="card"><h3>6. Học liệu tiếng Anh liên quan</h3>${related(x.month).map(r=>`<p><a href="${esc(r[1])}" target="_blank" rel="noopener">${esc(r[0])} ↗</a> <span class="muted tiny">${esc(r[2])}</span></p>`).join('')}</div><div class="card"><label>Nhật ký và bằng chứng ngày ${x.day}</label><textarea id="daynote" placeholder="Tôi đã hiểu gì? Đường dẫn mã nguồn? Những lỗi đã sửa?">${esc(state.notes[x.day]||'')}</textarea><div class="flex"><button class="secondary" onclick="state.notes[${x.day}]=document.getElementById('daynote').value;save();alert('Đã lưu nhật ký')">Lưu ghi chú</button><button class="primary" onclick="state.notes[${x.day}]=document.getElementById('daynote').value;state.done[${x.day}]=!state.done[${x.day}];save();render()">${state.done[x.day]?'Bỏ đánh dấu hoàn thành':'✓ Đánh dấu hoàn thành'}</button><button class="secondary" onclick="selectedDay=${Math.min(364,x.day+1)};view='day';render()">Buổi tiếp →</button></div></div><div class="card"><h3>Gia sư AI cho bài này</h3><button class="primary" onclick="view='ai';render()">Hỏi AI về bài đang học</button></div>`}
function related(m){let ix=({1:[1,2,9],2:[3,4],3:[5,16],4:[7,8],5:[6,8,9],6:[10,11],7:[12,13],8:[12,13,14],9:[14,15],10:[15,16],11:[6,7,8],12:[9,10,11]})[m]||[0];return ix.map(i=>DB.refs[i])}
function library(){return `<h2>Thư viện tri thức học thuật song ngữ</h2><p class="muted">Hai bộ tài liệu được phân loại riêng. Tài liệu tiếng Việt ưu tiên để tiếp cận kiến thức, tài liệu gốc tiếng Anh dùng để đối chiếu và cập nhật chuyên sâu. Một số liên kết tiếng Việt dẫn tới danh mục khóa học, cần chọn mô-đun phù hợp.</p><div class="card"><h3>🇻🇳 Bộ học liệu tiếng Việt (${VI_REFS.length} nguồn)</h3><div class="grid">${viCards()}</div></div><div class="card"><h3>🌐 Bộ học liệu tiếng Anh (${DB.refs.length} nguồn)</h3><div class="grid">${DB.refs.map(r=>`<div class="card"><h3>${esc(r[0])}</h3><span class="pill">${esc(r[2])}</span><p><a href="${esc(r[1])}" target="_blank" rel="noopener noreferrer">Mở tài liệu gốc ↗</a></p></div>`).join('')}</div></div><div class="notice">Chỉ lưu danh mục, mô tả và đường dẫn nguồn. Nội dung tài liệu của bên thứ ba không được sao chép vào website; cần Internet để mở. Một số trang có thể chưa được dịch đầy đủ hoặc thay đổi liên kết.</div>`}
function backup(){return `<h2>Dữ liệu học tập và sao lưu</h2><div class="card"><p>Tiến độ và nhật ký lưu trong trình duyệt này. Để chuyển máy hoặc phòng mất dữ liệu, hãy xuất JSON thường xuyên.</p><div class="flex"><button class="primary" onclick="download()">Xuất JSON</button><label class="secondary" style="cursor:pointer;margin:0">Nhập JSON <input type="file" accept=".json,application/json" style="display:none" onchange="upload(this)"></label></div></div><div class="notice">Không tự đồng bộ giữa các thiết bị. Không nhập thông tin bí mật của cơ quan vào ghi chú hoặc gia sư AI.</div>`}
function download(){let b=new Blob([JSON.stringify({version:4,exported:new Date().toISOString(),state},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='cntt-tien-do-v4.json';a.click();URL.revokeObjectURL(a.href)}
async function upload(el){try{let obj=JSON.parse(await el.files[0].text());if(!obj.state||!obj.state.done)throw Error('Sai cấu trúc');if(confirm('Nhập dữ liệu sẽ thay thế tiến độ hiện tại. Tiếp tục?')){state=obj.state;save();render()}}catch(e){alert('Không nhập được: '+e.message)}}
const examQ=[['CPU làm nhiệm vụ gì?',['Lưu dữ liệu vĩnh viễn','Thực thi lệnh','Cấp Internet'],1],['RAM khác SSD ở đâu?',['RAM thường mất dữ liệu khi mất điện','RAM luôn bền vững','RAM là CPU'],0],['Thuật toán là gì?',['Chuỗi bước giải bài toán','Một ứng dụng','Một ổ đĩa'],0],['7 // 2 trong Python bằng?',['3.5','3','4'],1],['len([2,4,6]) bằng?',['2','6','3'],2],['for dùng để?',['Lặp qua phần tử','Lưu mật khẩu','Thiết kế ảnh'],0],['Hàm giúp?',['Tái sử dụng logic','Tăng RAM','Thay CPU'],0],['API là?',['Giao diện giao tiếp giữa hệ thống','Ổ đĩa','Màn hình'],0],['Git dùng để?',['Quản lý phiên bản','Đồ họa','Mã hóa ổ đĩa'],0],['API key nên đặt ở đâu?',['Mã nguồn công khai','Biến môi trường phía máy chủ','README công khai'],1],['Khóa chính dữ liệu dùng để?',['Định danh bản ghi','Vẽ đồ thị','Tăng CPU'],0],['LLM có thể?',['Luôn đúng','Sinh văn bản nhưng có thể sai','Không thể viết mã'],1],['Debug nên bắt đầu từ?',['Tái hiện lỗi','Xóa mã','Đổi máy'],0],['CSV nên được xử lý bằng?',['Đọc và kiểm tra dữ liệu','Đoán ô trống','Chỉ nhìn bằng mắt'],0],['HTTP 404 nghĩa là?',['Thành công','Không tìm thấy tài nguyên','Máy hết RAM'],1]];
function exam(){return `<h2>Kiểm tra đầu vào</h2><p>15 câu kiến thức cơ bản và 2 câu tự luận. Không dùng AI trong khi làm bài.</p><div class="card">${examQ.map((q,i)=>`<div><p><b>${i+1}. ${esc(q[0])}</b></p>${q[1].map((a,j)=>`<label style="font-weight:400"><input type="radio" style="width:auto" name="q${i}" value="${j}" ${state.exam[i]==j?'checked':''} onchange="state.exam[${i}]=${j};save()"> ${esc(a)}</label>`).join('')}</div><hr>`).join('')}<label>16. Mô tả thuật toán đọc 100 nhiệm vụ, xác định quá hạn và thống kê theo phòng.</label><textarea id="essay1">${esc(state.exam.essay1||'')}</textarea><label>17. Phân biệt mô hình AI, API và AI Agent bằng một ví dụ.</label><textarea id="essay2">${esc(state.exam.essay2||'')}</textarea><button class="primary" onclick="state.exam.essay1=document.getElementById('essay1').value;state.exam.essay2=document.getElementById('essay2').value;let score=examQ.reduce((s,q,i)=>s+(state.exam[i]===q[2]?1:0),0);state.exam.score=score;save();document.getElementById('examresult').textContent='Trắc nghiệm: '+score+'/15. Hai câu tự luận cần người hướng dẫn hoặc AI chấm riêng.'">Chấm trắc nghiệm</button><p id="examresult">${state.exam.score===undefined?'':`Lần chấm gần nhất: ${state.exam.score}/15`}</p></div>`}
function aiPage(){return `<h2>Gia sư AI</h2><p class="muted">Hỏi đáp dựa trên học phần, bài học và tiến độ. Chỉ gửi dữ liệu khi bấm Gửi.</p><div class="notice">Kết nối API trực tiếp từ web tĩnh có nguy cơ lộ khóa trên thiết bị và có thể bị giới hạn CORS. Chỉ dùng khóa cá nhân giới hạn hạn mức; không đưa khóa vào mã nguồn hoặc lưu công khai. Để bảo vệ khóa cho nhiều người dùng, cần proxy phía máy chủ.</div><div class="card"><div class="two"><div><label>Nhà cung cấp</label><select id="provider" onchange="document.getElementById('model').value=this.value==='gemini'?'gemini-2.5-flash':'gpt-4.1-mini'"><option value="gemini">Gemini API</option><option value="openai">OpenAI API</option></select></div><div><label>Tên model</label><input id="model" value="gemini-2.5-flash"></div></div><label>API key (chỉ giữ trong phiên trang này)</label><input type="password" id="apikey" autocomplete="off" placeholder="Dán khóa riêng, không đưa vào mã nguồn"><label>Câu hỏi / mã nguồn cần phản biện</label><textarea id="prompt" placeholder="Giải thích bài hôm nay theo cách dễ hiểu và kiểm tra tôi bằng 3 câu hỏi"></textarea><div class="flex"><button class="primary" onclick="askAI()">Gửi tới mô hình</button><button class="secondary" onclick="state.chat=[];save();render()">Xóa lịch sử AI</button></div><p id="aistatus" class="muted tiny"></p><div class="chat">${state.chat.map(x=>`<div class="bubble"><b>${x.role==='user'?'Người học':'Gia sư'}:</b> ${esc(x.text)}</div>`).join('')}</div></div>`}
async function askAI(){let p=document.getElementById('provider').value,model=document.getElementById('model').value.trim(),key=document.getElementById('apikey').value.trim(),prompt=document.getElementById('prompt').value.trim(),status=document.getElementById('aistatus');if(!key||!prompt){alert('Nhập API key và câu hỏi');return}let l=DB.lessons[selectedDay-1],context=`Bạn là gia sư CNTT đại học, dạy bằng tiếng Việt. Hướng dẫn nguyên lý, không làm hộ bài ngay. Nêu giới hạn và khuyến nghị kiểm chứng với tài liệu gốc. Bài hiện tại: ngày ${l.day}, ${l.title}. Bài giảng: ${l.theory}. Bài tập: ${l.exercise}. Sản phẩm: ${l.output}. Tiến độ: ${doneCount()}/364. Không khẳng định có truy cập tài liệu trực tuyến nếu chưa có công cụ.`;status.textContent='Đang gọi API...';try{let r,txt;if(p==='gemini'){r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:context}]},contents:[{role:'user',parts:[{text:prompt}]}]})});let j=await r.json();if(!r.ok)throw Error(j.error?.message||r.status);txt=j.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('\n')||'Không có nội dung trả lời'}else{r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,messages:[{role:'system',content:context},{role:'user',content:prompt}]})});let j=await r.json();if(!r.ok)throw Error(j.error?.message||r.status);txt=j.choices?.[0]?.message?.content||'Không có nội dung trả lời'}state.chat.push({role:'user',text:prompt},{role:'assistant',text:txt});save();render();status=document.getElementById('aistatus');status.textContent='Đã nhận phản hồi. Lưu ý kiểm chứng kiến thức quan trọng.'}catch(e){status.textContent='Không kết nối được: '+e.message+' (kiểm tra khóa, tên model, quota và CORS).'}}
nav();render();</script></body></html>
